  gate_proofs:
    - clause: engine-specific score meaning is not embedded in generic types
      proved_by:
        - test_a_bare_number_is_not_a_score
        - test_score_requires_engine_and_semantics
        - test_three_unified_scores_cannot_share_a_definition_id
        - test_cross_engine_comparison_cannot_claim_numeric_equivalence
        - test_comparison_method_is_mandatory_and_closed
    - clause: frontend/backend types cannot silently diverge
      proved_by:
        - test_plugin_port_types_all_exist_in_the_scientific_schema
        - test_feature_table_and_quality_vector_are_not_interchangeable
    - clause: at least one fixture plugin validates
      proved_by:
        - test_all_plugin_manifests_validate
        - test_blocked_plugin_must_name_its_blocker
        - test_no_plugin_claims_to_be_available

  known_risks:
    - The four plugin manifests are declarations, not executions. No manifest has been proved to
      describe a working invocation, because B-P04-00 means no engine has run on a sample.
    - TypeScript type generation from the schemas is specified by ADR-0004 but not yet implemented;
      until P03 wires it, divergence is prevented by policy rather than by a build step.
    - A05 and A07 were deferred rather than completed. P03 must not assume they exist.

  next_prompt_inputs:
