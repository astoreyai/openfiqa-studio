        - ADR-0002 — no engine imported into the control-plane interpreter
        - ADR-0003 — /api/plugins must report BLOCKED engines with their blocker_id, not hide them
      toolchain_verified:
        node: v20.20.2
        pnpm: 10.28.0
        cargo: 1.96.0
        rustc: 1.96.0
        webkit2gtk-4.1: present
        python: 3.11.2
        uv: 0.9.26
      must_not_assume:
        - that run schemas (A05) or API contracts (A07) already exist
