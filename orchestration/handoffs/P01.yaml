  canonicalization_findings:
    - id: C1
      finding: US-FIQA IS the ofiq-quality distribution, not a separate engine
      evidence: ofiq-quality CLI self-describes as the Unified Facial Image Quality Scoring Framework; confirmed with the project owner 2026-08-07
      consequence: 04_BIOMETRIC_ENGINE_INTEGRATION lists B06 ofiq-quality and B07 US-FIQA as separate adapters. They are one adapter.
    - id: C2
      finding: the engines are not peers and do not share a pipeline stage
      evidence: "`ofiq-quality predict` takes FEATURES_PATH (CSV/Parquet) and accepts no image input, rc=0"
      consequence: every diagram showing `OFIQ / OFIQpy / US-FIQA / OpenFIQA` at one stage is wrong, including the series README and 12_FINAL_ACCEPTANCE_GAUNTLET step 11
    - id: C3
      finding: a required feature-engineering stage exists between extraction and scoring and is unpackaged
      evidence: feature_columns.json sha256 3b6ec824…2410 — 47 columns, of which 27 are extractor output, 7 are _polnorm, 13 are engineered composites
      consequence: P06 node classes need a FeatureEngineering node; P02 needs a FeatureTable type
    - id: C4
      finding: the OpenFIQA workspace publishes two distributions, not one
      evidence: root pyproject has no [project] table by design; ADR-002 fixes it at packages/openfiqa and packages/ofiq-quality
      consequence: openfiqa 0.5.0 is a distinct engine from ofiq-quality 0.2.0 and needs its own adapter
    - id: C5
      finding: openfiqa already implements a standards profile registry
      evidence: "`openfiqa profiles` rc=0 — iso-29794-5 (27 components) and icao-9303 (17), five modes each with accept/reject thresholds"
      consequence: P10 T02 standards registry should surface and extend this, not reimplement it

